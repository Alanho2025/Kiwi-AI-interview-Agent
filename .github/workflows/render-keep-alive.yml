name: Keep Render Backend Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping lightweight backend health endpoint
        run: |
          echo "Pinging Render backend..."
          curl --fail --silent --show-error --location --max-time 25 --retry 2 --retry-delay 5 "$RENDER_HEALTH_URL"
          echo "Render backend responded successfully."
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
