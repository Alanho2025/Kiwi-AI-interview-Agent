name: Keep Render Backend Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping lightweight backend health endpoint
        run: |
          echo "Pinging Render backend..."
          if [ -z "${RENDER_HEALTH_URL:-}" ]; then
            echo "RENDER_HEALTH_URL is not configured."
            echo "Add it in GitHub repository settings: Settings > Secrets and variables > Actions."
            exit 1
          fi
          curl --fail --silent --show-error --location --connect-timeout 15 --max-time 60 --retry 4 --retry-delay 10 --retry-all-errors "$RENDER_HEALTH_URL"
          echo "Render backend responded successfully."
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
