name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  frontend-quality:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend lint, tests, and build
        run: npm run quality:all

  backend-tests:
    name: Backend tests gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kiwi_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kiwi_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      AI_TEST_MODE: mock
      MATCH_ENGINE: semantic
      ENABLE_AGENTIC_SAFEGUARDS: true
      JWT_SECRET: ci-test-jwt-secret
      CSRF_SECRET: ci-test-csrf-secret
      SESSION_SECRET: ci-test-session-secret
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/kiwi_ai_test
      MONGODB_URI: mongodb://localhost:27017/kiwi_ai_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend lint
        run: npm run lint

      - name: Run backend build
        run: npm run build

      - name: Run backend full test suite
        run: npm run test:all

      - name: Run JD safeguard test
        run: npm run test:jd-safeguard

      - name: Run match safeguard test
        run: npm run test:match-safeguard

  frontend-e2e:
    name: Frontend E2E gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: frontend-quality
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run full human-flow E2E
        run: npm run test:e2e:human-flow

      - name: Run question-pipeline E2E
        run: npm run test:e2e:question-pipeline

  voice-real-backend-e2e:
    name: Voice real-backend E2E gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - frontend-quality
      - backend-tests

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kiwi_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kiwi_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      AI_TEST_MODE: mock
      MATCH_ENGINE: semantic
      ENABLE_AGENTIC_SAFEGUARDS: true
      JWT_SECRET: ci-test-jwt-secret
      CSRF_SECRET: ci-test-csrf-secret
      SESSION_SECRET: ci-test-session-secret
      GOOGLE_CLIENT_ID: ci-test-google-client
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/kiwi_ai_test
      MONGODB_URI: mongodb://localhost:27017/kiwi_ai_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run voice real-backend E2E
        working-directory: frontend
        run: npm run test:e2e:voice-real-backend

  backend-mock-evaluation:
    name: Backend mock evaluation gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: backend-tests

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kiwi_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kiwi_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      AI_TEST_MODE: mock
      MATCH_ENGINE: semantic
      ENABLE_AGENTIC_SAFEGUARDS: true
      JWT_SECRET: ci-test-jwt-secret
      CSRF_SECRET: ci-test-csrf-secret
      SESSION_SECRET: ci-test-session-secret
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/kiwi_ai_test
      MONGODB_URI: mongodb://localhost:27017/kiwi_ai_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run mock/local evaluation suite
        run: npm run eval:local

      - name: Upload mock evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-mock-eval-reports-${{ github.sha }}
          path: backend/eval/reports
          if-no-files-found: warn
          retention-days: 14

  backend-real-evaluation:
    name: Backend real AI evaluation gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: backend-mock-evaluation
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kiwi_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kiwi_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      MATCH_ENGINE: semantic
      ENABLE_AGENTIC_SAFEGUARDS: true
      JWT_SECRET: ci-test-jwt-secret
      CSRF_SECRET: ci-test-csrf-secret
      SESSION_SECRET: ci-test-session-secret
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/kiwi_ai_test
      MONGODB_URI: mongodb://localhost:27017/kiwi_ai_test
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify real evaluation secret
        run: |
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "DEEPSEEK_API_KEY is required for the real AI evaluation gate."
            echo "Add it in GitHub repository settings: Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run real AI evaluation suite
        run: npm run eval:real

      - name: Upload real evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-real-eval-reports-${{ github.sha }}
          path: backend/eval/reports
          if-no-files-found: warn
          retention-days: 14

  ci-summary:
    name: CI merge gate summary
    runs-on: ubuntu-latest
    needs:
      - frontend-quality
      - frontend-e2e
      - backend-tests
      - voice-real-backend-e2e
      - backend-mock-evaluation
      - backend-real-evaluation
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.frontend-quality.result }}" != "success" ]; then
            echo "frontend-quality failed: ${{ needs.frontend-quality.result }}"
            exit 1
          fi
          if [ "${{ needs.frontend-e2e.result }}" != "success" ]; then
            echo "frontend-e2e failed: ${{ needs.frontend-e2e.result }}"
            exit 1
          fi
          if [ "${{ needs.backend-tests.result }}" != "success" ]; then
            echo "backend-tests failed: ${{ needs.backend-tests.result }}"
            exit 1
          fi
          if [ "${{ needs.voice-real-backend-e2e.result }}" != "success" ]; then
            echo "voice-real-backend-e2e failed: ${{ needs.voice-real-backend-e2e.result }}"
            exit 1
          fi
          if [ "${{ needs.backend-mock-evaluation.result }}" != "success" ]; then
            echo "backend-mock-evaluation failed: ${{ needs.backend-mock-evaluation.result }}"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ needs.backend-real-evaluation.result }}" != "success" ]; then
            echo "backend-real-evaluation failed: ${{ needs.backend-real-evaluation.result }}"
            exit 1
          fi
          echo "All CI gates passed. Safe to merge into main."
