name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  frontend-quality:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend lint, tests, and build
        run: npm run quality:all

  backend-tests:
    name: Backend tests gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      AI_TEST_MODE: mock
      MATCH_ENGINE: semantic
      ENABLE_AGENTIC_SAFEGUARDS: true
      JWT_SECRET: ci-test-jwt-secret
      CSRF_SECRET: ci-test-csrf-secret
      SESSION_SECRET: ci-test-session-secret
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/kiwi_ai_test
      MONGODB_URI: mongodb://localhost:27017/kiwi_ai_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend lint
        run: npm run lint

      - name: Run backend full test suite
        run: npm run test:all

      - name: Run JD safeguard test
        run: npm run test:jd-safeguard

      - name: Run match safeguard test
        run: npm run test:match-safeguard

  backend-evaluation:
    name: Backend full evaluation gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: backend-tests
    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      MATCH_ENGINE: semantic
      ENABLE_AGENTIC_SAFEGUARDS: true
      JWT_SECRET: ci-test-jwt-secret
      CSRF_SECRET: ci-test-csrf-secret
      SESSION_SECRET: ci-test-session-secret
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/kiwi_ai_test
      MONGODB_URI: mongodb://localhost:27017/kiwi_ai_test
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify real evaluation secret
        run: |
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "DEEPSEEK_API_KEY is required for the full evaluation gate."
            echo "Add it in GitHub repository settings: Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run full evaluation suite
        run: npm run eval:all

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-eval-reports-${{ github.sha }}
          path: backend/eval/reports
          if-no-files-found: warn
          retention-days: 14

  ci-summary:
    name: CI merge gate summary
    runs-on: ubuntu-latest
    needs:
      - frontend-quality
      - backend-tests
      - backend-evaluation
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.frontend-quality.result }}" != "success" ]; then
            echo "frontend-quality failed: ${{ needs.frontend-quality.result }}"
            exit 1
          fi
          if [ "${{ needs.backend-tests.result }}" != "success" ]; then
            echo "backend-tests failed: ${{ needs.backend-tests.result }}"
            exit 1
          fi
          if [ "${{ needs.backend-evaluation.result }}" != "success" ]; then
            echo "backend-evaluation failed: ${{ needs.backend-evaluation.result }}"
            exit 1
          fi
          echo "All CI gates passed. Safe to merge into main."
