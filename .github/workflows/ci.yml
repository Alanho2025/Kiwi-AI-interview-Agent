name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-quality:
    name: Frontend Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Quality Checks (Lint, Test, Build)
        working-directory: ./frontend
        run: npm run quality:all

  backend-quality:
    name: Backend Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Lint
        working-directory: ./backend
        run: npm run lint

      - name: Run Unit & Integration Tests
        working-directory: ./backend
        run: npm run test:all

      - name: Run E2E & Eval Tests
        working-directory: ./backend
        run: |
          echo "Running Evaluator tests..."
          # Note: Eval tests require external API keys to succeed.
          # If they fail, please configure the necessary secrets in GitHub Settings -> Secrets.
          npm run eval:all || echo "::warning::Eval tests failed. Please ensure OPENAI_API_KEY and other secrets are set in GitHub if required."
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          PG_CONNECTION_STRING: ${{ secrets.PG_CONNECTION_STRING }}
